modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

# This is a URL to e.g. your GitHub or CurseForge issues page.
# It will appear in any crash reports this mod is directly involved in.
# issueTrackerURL="https://github.com/invalid/pleasechangeme/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader

[[mods]]
modId = "phoenix_tesla_network"
version = "${version}"
displayName = "PhoenixTeslaNetwork"
displayURL = "${mod_url}"
# This will be displayed as your mod's logo in the Mods panel.
# logoFile="icon.png" #optional
# Some more fluff displayed in the Mods panel. Feel free to issue your special thanks here!
# credits="Thanks to Mojang for making this great game" #optional
# Some more fluff displayed in the Mods panel. Plug your stuff here!
authors="${mod_author}"
description = '''A small wireless eu GTM addon.'''

[[dependencies.phoenix_tesla_network]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.phoenix_tesla_network]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.phoenix_tesla_network]]
modId = "gtceu"
mandatory = true
versionRange = "[${gtceu_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.phoenix_tesla_network]]
modId = "jade"
mandatory = true
versionRange = "[${gtceu_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.phoenix_tesla_network]]
modId = "geckolib"
mandatory = true
versionRange = "[0,)"
ordering = "BEFORE"
side = "BOTH"

# Optional team providers. Tesla networks belong to a team; whichever of these is present decides what a
# "team" is (Phoenix Guilds first, then FTB Teams, otherwise each player is their own team).
[[dependencies.phoenix_tesla_network]]
modId = "phoenix_guilds"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.phoenix_tesla_network]]
modId = "ftbteams"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
